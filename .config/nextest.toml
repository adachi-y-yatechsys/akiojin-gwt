# Issue #3845: a blocked test must fail without preventing later tests from running.
[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# Issue #4822: local Windows canonical verification opts into this profile.
# Bound process pressure while allowing pure units to overlap fixture work.
[profile.gwt-verify]
retries = 0
test-threads = 4

[profile.gwt-verify.junit]
path = "junit.xml"

[test-groups.git-process]
max-threads = 1

# These modules create repositories, processes, or host/daemon fixtures.
# Keep the policy scoped to the local profile; CI retains its own schedule.
[[profile.gwt-verify.overrides]]
filter = 'package(gwt-git) | test(/^(cli|agent_project_state|app_runtime|branch_cleanup|daemon_runtime|daemon_supervisor|index_search|index_worker|issue_cache|issue_monitor_settlement|issue_monitor_worker|knowledge_bridge|launch_wizard|managed_assets|pm_registry|process|recovery_delivery|recovery_delivery_tests|start_work|test_guard|worktree)::/) | (package(=gwt-core) & (kind(test) | test(/^(board_remote_roots|coordination|index|migration|paths|repo_hash|workspace_projection)::/)))'
test-group = "git-process"
